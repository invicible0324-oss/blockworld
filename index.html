
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockworld</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            background: #182530;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        main {
            margin: 100px auto;
            padding: 30px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            color: #bdc8d1;
        }

        .game-box {
            max-width: 800px;
            margin: auto;
            padding: 60px 20px;
            background: #202b35;
            border-radius: 15px;
        }

        button {
            background: #43a65d;
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #328448;
        }

        footer {
            color: #718096;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>BLOCKWORLD</header>

    <main>
        <div class="game-box">
            <h1>Ready to play?</h1>

            <p>Your browser-based Minecraft experience.</p>

            <br>

            <button onclick="alert('Game coming soon!')">
                LAUNCH GAME
            </button>
        </div>
    </main>

    <footer>
        Blockworld | Version 1.12
    </footer>

</body>
</html>
